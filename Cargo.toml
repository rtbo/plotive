[package]
name = "plotive"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
plotive-base.workspace = true
plotive-text.workspace = true
# feature serde
serde = { workspace = true, optional = true }
serde-value = { version = "0.7", optional = true }

[dev-dependencies]
plotive-iced = { path = "iced", features = ["clipboard"] }
plotive-svg = { path = "svg" }
plotive-pxl = { path = "pxl" }
rand.workspace = true
rand_distr.workspace = true
rand_chacha.workspace = true
ode_solvers = "0.6.1"
serde_json.workspace = true
noyalib = "0.0.6"


[features]
default = ["noto-sans"]

data-csv = []
noto-mono = ["plotive-text/noto-mono"]
noto-sans = ["plotive-text/noto-sans"]
noto-sans-italic = ["plotive-text/noto-sans-italic"]
noto-serif = ["plotive-text/noto-serif"]
noto-serif-italic = ["plotive-text/noto-serif-italic"]
serde = ["plotive-base/serde", "plotive-text/serde", "dep:serde", "dep:serde-value"]
time = []
utils = []

[[example]]
name = "area"

[[example]]
name = "bars"

[[example]]
name = "bitcoin"
required-features = ["data-csv", "time"]

[[example]]
name = "bode_rlc"
required-features = ["noto-serif-italic", "utils"]

[[example]]
name = "bouncing_ball"
required-features = ["time"]

[[example]]
name = "gauss"

[[example]]
name = "iris"
required-features = ["data-csv"]

[[example]]
name = "minimal"

[[example]]
name = "multiple_axes"
required-features = ["utils"]

[[example]]
name = "readme"

[[example]]
name = "sine"

[[example]]
name = "stars"
required-features = ["data-csv"]

[[example]]
name = "subplots"
required-features = ["utils"]

[workspace]
members = ["base", "iced", "pxl", "svg", "text", "tests"]
resolver = "3"

[workspace.package]
version = "0.6.0-dev"
authors = ["Rémi THEBAULT"]
description = "Simple data plotting library"
edition = "2024"
repository = "https://github.com/rtbo/plotive"
license = "MIT"
categories = ["science", "graphics"]
keywords = ["data", "visualization", "plotting"]

[workspace.dependencies]
plotive = { version = "0.6.0-dev", path = "." }
plotive-base = { version = "0.6.0-dev", path = "base" }
plotive-pxl = { version = "0.6.0-dev", path = "pxl" }
plotive-svg = { version = "0.6.0-dev", path = "svg" }
plotive-text = { version = "0.6.0-dev", path = "text" }
arboard = "3.6.1"
bytes = "1.6"
iced = { version = "0.14.0", features = [
    "advanced",
    "canvas",
    "image",
    "tokio",
] }
iced_font_awesome = "0.4.0"
log = "0.4"
rand = "0.9.2"
rand_distr = "0.5.1"
rand_chacha = "0.9.0"
rfd = "0.17.1"
rustybuzz = "0.20.1"
serde = "1.0.228"
serde_json = "1.0.149"
strict-num = "0.2.0"
tiny-skia = "0.11.4"
tiny-skia-path = "0.11.4"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time"] }

[workspace.dependencies.ttf-parser]
version = "0.25.1"
default-features = false
features = [
    "opentype-layout",
    "apple-layout",
    "variable-fonts",
    "glyph-names",
    "no-std-float",
]
